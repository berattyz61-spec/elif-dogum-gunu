<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Elif</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&display=swap');

        :root {
            --bordo: #5C001E;
            --pembe: #FADADD;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bordo);
            color: var(--pembe);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* Müzik Çalar (YouTube Destekli) */
        #music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(250, 218, 221, 0.15);
            border: 1px solid rgba(250, 218, 221, 0.4);
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            z-index: 100;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 1s;
            pointer-events: none;
        }
        
        #music-player.visible {
            opacity: 1;
            pointer-events: all;
        }

        .music-btn {
            background: none;
            border: none;
            color: var(--pembe);
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .music-btn:hover {
            transform: scale(1.2);
        }

        /* Ekranlar */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: all;
            cursor: pointer;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            font-style: italic;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 500;
            line-height: 1.5;
            max-width: 600px;
        }

        .hint {
            position: absolute;
            bottom: 40px;
            font-size: 0.9rem;
            opacity: 0.6;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }

        /* Zaman Tüneli */
        #screen3 {
            position: relative;
            height: auto;
            min-height: 100vh;
            justify-content: flex-start;
            padding: 100px 20px 50px 20px;
            cursor: default;
            display: none;
            z-index: 5;
        }

        #screen3.active {
            display: block;
            opacity: 1;
            pointer-events: all;
        }

        .timeline-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            text-align: center;
            margin-bottom: 60px;
            font-style: italic;
        }

        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: var(--pembe);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
            border-radius: 2px;
            opacity: 0.3;
        }

        .container {
            padding: 10px 40px;
            position: relative;
            width: 50%;
            margin-bottom: 20px;
        }

        .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            right: -10px;
            background-color: var(--bordo);
            border: 4px solid var(--pembe);
            top: 25px;
            border-radius: 50%;
            z-index: 1;
            transition: all 0.3s;
        }

        .left { left: 0; }
        .right { left: 50%; }
        .right::after { left: -10px; }

        .content {
            padding: 20px 25px;
            background: rgba(250, 218, 221, 0.05);
            border: 1px solid rgba(250, 218, 221, 0.15);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }

        .content h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--pembe);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .text-body {
            height: 0;
            opacity: 0;
            overflow: hidden;
            font-weight: 300;
            line-height: 1.6;
            margin-top: 0;
            font-size: 0.95rem;
        }

        /* Açık Kutu Durumu */
        .content.open {
            background: rgba(250, 218, 221, 0.12);
            border-color: rgba(250, 218, 221, 0.4);
            transform: scale(1.02);
        }

        .content.open .text-body {
            height: auto;
            opacity: 1;
            margin-top: 15px;
        }

        /* Kilitli Kutu Durumu */
        .container.locked {
            opacity: 0.4;
            pointer-events: none;
        }
        
        .container.locked .content {
            background: rgba(0, 0, 0, 0.2);
        }

        .container.locked::after {
            border-color: rgba(250, 218, 221, 0.3);
            background-color: #3a0013;
        }
        
        /* Son 150. Gün Final Modalı */
        #final-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(145,0,47,0.95) 0%, rgba(41,0,13,0.98) 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
            backdrop-filter: blur(10px);
        }

        #final-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        #final-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 0 15px rgba(250, 218, 221, 0.5);
        }

        #final-text {
            font-size: 1.2rem;
            line-height: 1.8;
            max-width: 800px;
            text-align: center;
            color: var(--pembe);
            min-height: 200px;
        }

        /* İmleç Efekti */
        .cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media screen and (max-width: 768px) {
            .title { font-size: 2.8rem; }
            .subtitle { font-size: 1.4rem; }
            .timeline::after { left: 31px; }
            .container { width: 100%; padding-left: 70px; padding-right: 10px; }
            .container::after { left: 21px; }
            .left::after, .right::after { left: 21px; }
            .right { left: 0%; }
            #music-player { top: 10px; right: 10px; padding: 8px 12px; gap: 10px; font-size: 0.8rem; }
            #final-title { font-size: 2.2rem; }
            #final-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- 150. Gün Tıklama Ses Efekti (Dosyayı kendin yüklemelisin) -->
    <audio id="special-sound" src="final-sesi.mp3"></audio>

    <!-- Gizli YouTube Çerçevesi -->
    <div id="player" style="position: absolute; top: -9999px; left: -9999px;"></div>

    <!-- Müzik Çalar -->
    <div id="music-player">
        <span>🎵</span>
        <span id="song-name">Müzik Yükleniyor...</span>
        <button class="music-btn" id="play-btn" onclick="togglePlay()">▶</button>
        <button class="music-btn" onclick="nextSong()">⏭</button>
    </div>

    <!-- 1. Ekran -->
    <div id="screen1" class="screen active" onclick="nextScreen(1)">
        <h1 class="title">Merhaba Elif...</h1>
        <p class="hint">(Devam etmek için ekrana dokun)</p>
    </div>

    <!-- 2. Ekran -->
    <div id="screen2" class="screen" onclick="nextScreen(2)">
        <h2 class="subtitle">5 aylık bu ilişkiyi bir de Berat'ın gözünden görmeye hazır mısın?</h2>
        <p class="hint">(Başlamak için dokun)</p>
    </div>

    <!-- 3. Ekran (Zaman Tüneli) -->
    <div id="screen3" class="screen">
        <h2 class="timeline-title">Bizim Hikayemiz</h2>
        <div class="timeline" id="timeline-container">
            <!-- JS ile doldurulacak -->
        </div>
        <br><br><br><br>
    </div>
    
    <!-- FİNAL EKRANI (150. Gün) -->
    <div id="final-modal">
        <h1 id="final-title">135-150. Günler</h1>
        <div id="final-text" class="cursor"></div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- YOUTUBE MÜZİK SİSTEMİ ---
        
        // DİKKAT: Şarkıların YouTube URL'lerindeki 'v=' sonrasındaki kodları buraya yaz:
        const youtubeVideos = [
            { id: 'mGr_5vbL80Y', title: 'Duman - Her Şeyi Yak' },
            { id: 'UmP-XGBqess', title: 'Majeste - Aşk Dediğin' },
            { id: 'VnG09qT6xKU', title: 'Yüksek Sadakat - Kafile' }
        ];

        let player;
        let currentSongIndex = 0;
        let isPlaying = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: youtubeVideos[currentSongIndex].id,
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('song-name').innerText = youtubeVideos[currentSongIndex].title;
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                nextSong(); // Şarkı bitince diğerine geç
            }
        }

        function togglePlay() {
            const playBtn = document.getElementById('play-btn');
            if (isPlaying) {
                player.pauseVideo();
                playBtn.innerHTML = "▶";
            } else {
                player.playVideo();
                playBtn.innerHTML = "⏸";
            }
            isPlaying = !isPlaying;
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % youtubeVideos.length;
            player.loadVideoById(youtubeVideos[currentSongIndex].id);
            document.getElementById('song-name').innerText = youtubeVideos[currentSongIndex].title;
            isPlaying = true;
            document.getElementById('play-btn').innerHTML = "⏸";
        }


        // --- YAVAŞ YAZMA (TYPEWRITER) EFEKTİ ---
        function typeWriter(element, text, speed = 35) {
            let i = 0;
            element.innerHTML = "";
            element.classList.add("cursor");
            
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.classList.remove("cursor"); // Yazı bitince imleci kaldır
                }
            }
            type();
        }

        // --- EKRAN GEÇİŞLERİ ---
        function nextScreen(currentScreenNumber) {
            if(currentScreenNumber === 1 && player && typeof player.playVideo === 'function') {
                player.playVideo();
                isPlaying = true;
                document.getElementById('play-btn').innerHTML = "⏸";
            }

            const currentScreen = document.getElementById('screen' + currentScreenNumber);
            const nextScreen = document.getElementById('screen' + (currentScreenNumber + 1));
            
            currentScreen.classList.remove('active');
            
            setTimeout(() => {
                nextScreen.classList.add('active');
                if(currentScreenNumber + 1 === 3) {
                    document.body.style.overflowY = "auto";
                    document.getElementById('music-player').classList.add('visible');
                }
            }, 1000);
        }

        // --- ZAMAN TÜNELİ VERİLERİ ---
        const storyData = [
            { title: "1. Gün", text: "Bana yazdın, çok heyecanlıydım. Hayatımda ilk defa bir kızı gerçekten seviyordum ve bana yazdı. Konuşmaya başladık, o heyecanla gece 4'e kadar konuştuk. Çok iyiydi, uyurken mutlu uyudum." },
            { title: "2. Gün", text: "Sabah kalktığımda tabii ki aklıma ilk sen geldin. Gece 4'te yatmamıza rağmen o heyecanla sabah erkenden kalktım ve ilk işim sana günaydın yazmaktı. Hala heyecanlıyım, hiç aklımdan çıkmıyorsun." },
            { title: "3. Gün", text: "Artık o kadar heyecanlıyız ki, o kadar yazışıyoruz ki... Şu 3 günde telefonla hayatımda hiç yazışmadığım kadar yazıştım seninle. Çok seviyordum seni." },
            { title: "10. Gün", text: "Okulun son günleri olduğu için 1 hafta gitmedik. Karne günü ilk defa konuşmaya başladıktan sonra geldim, saçımla hiç uğraşmadığım kadar uğraştım. Seni görmemiş gibi yaptım özür dilerim ama aslında görmüştüm, sadece çok heyecanlıydım." },
            { title: "20. Gün", text: "Normalde birisiyle 20 gün aralıksız asla konuşmam ama sen de, ben de aşıktık birbirimize." },
            { title: "30. Gün", text: "İlk ayımız... Yavaş yavaş seni gerçekten sevdiğimi anlamaya başladım. Alışıyordum sana. Benden utandığını seziyordum ve bunu anladığım zaman kendime söz verdim: Utanma huyunu beraber aşacaktık. Bunu hayal ederek yaşamaya başladım." },
            { title: "30-45. Günler", text: "Yani ilk defa bir yaz tatilim güzel, eğlenceli, sevgi dolu geliyordu. Ve küçük küçük bana alışmaya başladığın için sana olan sevgim daha da büyümeye başladı." },
            { title: "45-61. Günler", text: "2 ayı doldurduk ve gerçekten günlerce durmadan yazmaktan sıkılmadım, aksine sevgim artıyordu. Ve seni Trabzonlu yaptımmmmm!" },
            { title: "60-75. Günler", text: "İlk buluşmaları yapmıştık. O ilk günü hatırlıyorum, duvarın üstüne oturduk. İlk defa orada el ele tutuştuk. Elini zor veriyordun, yanıma gelmen için 2 saat uzaktan telefonla konuştum ama buna değdi. O duvarda oturduğumuz, sırt sırta verdiğimiz anlar çok güzeldi. Asla unutulmayacak günler." },
            { title: "75-90. Günler", text: "Galiba 2. buluşmayı da yaptık. Açıkçası garip bir buluşmaydı ama yine de anıydı, güzeldi. Yavaş yavaş alışıyordun ve ilk yanağından öptüğüm zamanlardı. Eve sarhoş gibi gittim." },
            { title: "90-105. Günler", text: "3. ay... Sana cidden alıştım. Arada küçük kavgalar etsek de küsmemek için, her seferinde küçük şeyleri büyütmeyelim diye yumuşattım. Çünkü sevdiğim, gerçekten sevdiğim birinden ayrılmak istemiyordum." },
            { title: "105-120. Günler", text: "4. ayı doldurduk. Gerçekten ben hayatımda bu kadar uzun bir zamanı bir insana ayırdığımı bilmiyorum. Annemle bile 1 gün konuşmadığım zaman vardır ama senle yoktur. Ve çok mutluydum." },
            { title: "120-135. Günler", text: "Artık okullar açıldı, birbirimizi gördük, alıştık. Cidden herkes öğrendi, artık biliyorlardı ve bizi seviyorlardı. Ayrılmamızı onlar bile istemezdi." },
            { title: "135-150. Günler", isFinal: true, text: "Artık cidden alıştık, seni bırakamam aşkım. Seni çok çok seviyorum. Hayatımda bir kızı seveceğimi düşünmezdim. Kimse düşünmezdi çünkü ben sevgili yapan biri değildim. Egomdan değil, doğru kişiyi istediğimden yapmıyordum ve sanırım buldum. Elif ben seni cidden çok seviyorum. Hayatımda büyük bir rol oynuyorsun aşkım. Sen olmasaydın eski, sıradan Berat olacaktı, sıkıcı günleri boş geçen... Ama artık her an aklıma sen gelebiliyorsun. Ve bana da alıştın, yüzüme baktın. 5 ay bunu bekledim ve karşılığını aldım. İyi ki de dayanmışım, buna sonuna kadar değdi. Aşkım ben senle 5 ay değil sonsuza kadar gitmek istiyorum. Sen de istersen neden olmasın, beraber olursak hiçbir şey imkansız olamaz. Elif seni çok seviyorum, bana çok şey kattın. Seni çok seviyorum birtanecik aşkkııımmm 💌" }
        ];

        const timelineContainer = document.getElementById('timeline-container');
        let highestUnlocked = 0;

        storyData.forEach((data, index) => {
            const position = index % 2 === 0 ? 'left' : 'right';
            const isLocked = index > highestUnlocked ? 'locked' : '';
            const lockIcon = index > highestUnlocked ? '🔒' : '💌';

            const html = `
                <div class="container ${position} ${isLocked}" id="item-${index}">
                    <div class="content" onclick="openItem(${index})">
                        <h3>${data.title} <span id="icon-${index}">${lockIcon}</span></h3>
                        <div class="text-body" id="text-${index}"></div>
                    </div>
                </div>
            `;
            timelineContainer.innerHTML += html;
        });

        function openItem(index) {
            const item = document.getElementById(`item-${index}`);
            const content = item.querySelector('.content');
            const data = storyData[index];
            
            if(item.classList.contains('locked')) return;

            // EĞER FİNAL GÜNÜYSE (150. Gün)
            if (data.isFinal) {
                // Ses efektini çal
                const specialSound = document.getElementById('special-sound');
                specialSound.play().catch(e => console.log("Ses efekti bulunamadı veya engellendi"));
                
                // Müzik çaları gizle ve arkaplanı göster
                document.getElementById('music-player').classList.remove('visible');
                const finalModal = document.getElementById('final-modal');
                finalModal.classList.add('active');
                
                // Final yazısını yavaş yavaş ekrana yazdır (biraz gecikmeli başlasın)
                setTimeout(() => {
                    const finalTextDiv = document.getElementById('final-text');
                    typeWriter(finalTextDiv, data.text, 50); // Final yazısı biraz daha yavaş ve vurgulu
                }, 1000);
                return;
            }

            // Normal günler için
            if(content.classList.contains('open')) return;

            content.classList.add('open');
            document.getElementById(`icon-${index}`).innerText = '💌';
            
            // Metni yavaş yavaş yazdır
            const textDiv = document.getElementById(`text-${index}`);
            typeWriter(textDiv, data.text, 35); // 35ms hızla yazdır

            // Kilidi açma
            if(index === highestUnlocked && index < storyData.length - 1) {
                highestUnlocked++;
                const nextItem = document.getElementById(`item-${highestUnlocked}`);
                nextItem.classList.remove('locked');
                
                setTimeout(() => {
                    nextItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 400);
            }
        }
    </script>
</body>
</html>
