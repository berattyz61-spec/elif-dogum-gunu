<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Elif</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&display=swap');

        :root {
            --bordo: #5C001E;
            --pembe: #FADADD;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bordo);
            color: var(--pembe);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* Müzik Çalar (Spotify tarzı mini ekran) */
        #music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 340px;
            padding: 12px 14px 12px 12px;
            border-radius: 16px;
            background: rgba(35, 0, 12, 0.78);
            border: 1px solid rgba(250, 218, 221, 0.22);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transform: translateY(-14px) scale(0.96);
            transition: opacity 1s, transform 1s cubic-bezier(.2, .8, .2, 1), box-shadow 0.6s;
            pointer-events: none;
        }

        #music-player.visible {
            opacity: 1;
            transform: none;
            pointer-events: all;
        }

        /* Şarkı değişince kısa bir parlama */
        #music-player.changing {
            box-shadow: 0 0 0 1px rgba(250, 218, 221, 0.5), 0 0 30px rgba(250, 218, 221, 0.35);
        }

        .mp-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Albüm kapağı (YouTube küçük resmi) */
        .cover {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 8px;
            overflow: hidden;
            background: linear-gradient(135deg, #91002f, #3a0013);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--pembe);
        }

        .cover img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover.pop {
            animation: coverPop 0.7s cubic-bezier(.3, 1.4, .5, 1);
        }

        @keyframes coverPop {
            0%   { transform: scale(0.8) rotate(-6deg); opacity: 0.4; }
            100% { transform: none; opacity: 1; }
        }

        /* Ekolayzer (çalarken kapağın altında görünür) */
        .eq {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 26px;
            padding: 0 0 4px;
            box-sizing: border-box;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .eq i {
            display: block;
            width: 3px;
            height: 100%;
            background: var(--pembe);
            border-radius: 2px;
            transform-origin: bottom;
            transform: scaleY(0.25);
            animation: eq 1s ease-in-out infinite;
            animation-play-state: paused;
        }

        .eq i:nth-child(2) { animation-duration: 0.8s; animation-delay: -0.4s; }
        .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -0.2s; }
        .eq i:nth-child(4) { animation-duration: 0.9s; animation-delay: -0.7s; }

        #music-player.playing .eq { opacity: 1; }
        #music-player.playing .eq i { animation-play-state: running; }

        @keyframes eq {
            0%, 100% { transform: scaleY(0.2); }
            50%      { transform: scaleY(1); }
        }

        /* Şarkı adı */
        .track-info {
            flex: 1;
            min-width: 0;
            text-align: left;
            line-height: 1.3;
        }

        .track-info.swap {
            animation: trackIn 0.7s cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes trackIn {
            from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
            to   { opacity: 1; transform: none; filter: blur(0); }
        }

        .track-title-wrap {
            overflow: hidden;
            white-space: nowrap;
        }

        .track-title {
            display: inline-block;
            font-size: 0.92rem;
            font-weight: 500;
            color: #fff;
        }

        /* Uzun şarkı adları sağa sola kayar */
        .track-title.scroll {
            animation: marquee 9s ease-in-out infinite alternate;
        }

        @keyframes marquee {
            0%, 15%   { transform: translateX(0); }
            85%, 100% { transform: translateX(var(--shift, 0px)); }
        }

        .track-artist {
            font-size: 0.74rem;
            opacity: 0.65;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Butonlar */
        .controls {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .music-btn {
            background: none;
            border: none;
            color: var(--pembe);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .music-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .music-btn:hover {
            transform: scale(1.15);
            background: rgba(250, 218, 221, 0.15);
        }

        .music-btn:active {
            transform: scale(0.92);
        }

        .music-btn.main {
            width: 38px;
            height: 38px;
            background: var(--pembe);
            color: var(--bordo);
        }

        .music-btn.main:hover {
            background: #fff;
        }

        .music-btn.main svg {
            width: 20px;
            height: 20px;
        }

        .music-btn .icon-pause { display: none; }
        #music-player.playing .music-btn .icon-play { display: none; }
        #music-player.playing .music-btn .icon-pause { display: block; }

        /* Süre çubuğu (sürükleyerek şarkıda ileri geri gidilir) */
        .mp-seek {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time {
            font-size: 0.68rem;
            opacity: 0.7;
            min-width: 30px;
            font-variant-numeric: tabular-nums;
        }

        .time.total {
            text-align: right;
        }

        .seek {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            min-width: 0;
            height: 22px;
            margin: 0;
            background: transparent;
            cursor: pointer;
            --p: 0%;
        }

        .seek:focus {
            outline: none;
        }

        .seek::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, var(--pembe) var(--p), rgba(250, 218, 221, 0.25) var(--p));
        }

        .seek::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            margin-top: -4px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            transition: transform 0.15s;
        }

        .seek:active::-webkit-slider-thumb {
            transform: scale(1.3);
        }

        .seek::-moz-range-track {
            height: 4px;
            border-radius: 2px;
            background: rgba(250, 218, 221, 0.25);
        }

        .seek::-moz-range-progress {
            height: 4px;
            border-radius: 2px;
            background: var(--pembe);
        }

        .seek::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }

        @media (prefers-reduced-motion: reduce) {
            .eq i, .track-title.scroll { animation: none; }
        }

        /* Ekranlar */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: all;
            cursor: pointer;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            font-style: italic;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 500;
            line-height: 1.5;
            max-width: 600px;
        }

        .hint {
            position: absolute;
            bottom: 40px;
            font-size: 0.9rem;
            opacity: 0.6;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }

        /* Zaman Tüneli */
        #screen3 {
            position: relative;
            height: auto;
            min-height: 100vh;
            justify-content: flex-start;
            padding: 100px 20px 50px 20px;
            cursor: default;
            display: none;
            z-index: 5;
        }

        #screen3.active {
            display: block;
            opacity: 1;
            pointer-events: all;
        }

        .timeline-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            text-align: center;
            margin-bottom: 60px;
            font-style: italic;
        }

        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: var(--pembe);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -2px;
            border-radius: 2px;
            opacity: 0.3;
        }

        .container {
            padding: 10px 40px;
            position: relative;
            width: 50%;
            margin-bottom: 20px;
        }

        .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            right: -10px;
            background-color: var(--bordo);
            border: 4px solid var(--pembe);
            top: 25px;
            border-radius: 50%;
            z-index: 1;
            transition: all 0.3s;
        }

        .left { left: 0; }
        .right { left: 50%; }
        .right::after { left: -10px; }

        .content {
            padding: 20px 25px;
            background: rgba(250, 218, 221, 0.05);
            border: 1px solid rgba(250, 218, 221, 0.15);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }

        .content h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--pembe);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .text-body {
            height: 0;
            opacity: 0;
            overflow: hidden;
            font-weight: 300;
            line-height: 1.6;
            margin-top: 0;
            font-size: 0.95rem;
        }

        /* Açık Kutu Durumu */
        .content.open {
            background: rgba(250, 218, 221, 0.12);
            border-color: rgba(250, 218, 221, 0.4);
            transform: scale(1.02);
        }

        .content.open .text-body {
            height: auto;
            opacity: 1;
            margin-top: 15px;
        }

        /* Kilitli Kutu Durumu */
        .container.locked {
            opacity: 0.4;
            pointer-events: none;
        }
        
        .container.locked .content {
            background: rgba(0, 0, 0, 0.2);
        }

        .container.locked::after {
            border-color: rgba(250, 218, 221, 0.3);
            background-color: #3a0013;
        }
        
        /* Son 150. Gün Final Modalı */
        #final-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(145,0,47,0.95) 0%, rgba(41,0,13,0.98) 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
            backdrop-filter: blur(10px);
        }

        #final-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        #final-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 0 15px rgba(250, 218, 221, 0.5);
        }

        #final-text {
            font-size: 1.2rem;
            line-height: 1.8;
            max-width: 800px;
            text-align: center;
            color: var(--pembe);
            min-height: 200px;
        }

        /* İmleç Efekti */
        .cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media screen and (max-width: 768px) {
            .title { font-size: 2.8rem; }
            .subtitle { font-size: 1.4rem; }
            .timeline::after { left: 31px; }
            .container { width: 100%; padding-left: 70px; padding-right: 10px; }
            .container::after { left: 21px; }
            .left::after, .right::after { left: 21px; }
            .right { left: 0%; }
            #music-player { top: 10px; right: 10px; width: min(300px, calc(100vw - 20px)); padding: 10px 12px 8px 10px; }
            .cover { width: 46px; height: 46px; }
            .track-title { font-size: 0.85rem; }
            .music-btn { width: 28px; height: 28px; }
            .music-btn.main { width: 34px; height: 34px; }
            #final-title { font-size: 2.2rem; }
            #final-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- 150. Gün Tıklama Ses Efekti (Dosyayı kendin yüklemelisin) -->
    <audio id="special-sound" src="final-sesi.mp3"></audio>

    <!-- Gizli YouTube Çerçevesi -->
    <div id="player" style="position: absolute; top: -9999px; left: -9999px;"></div>

    <!-- Müzik Çalar -->
    <div id="music-player">
        <div class="mp-top">
            <div class="cover" id="cover">
                ♪
                <img id="cover-img" alt="">
                <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="track-info" id="track-info">
                <div class="track-title-wrap"><span class="track-title" id="song-name">Müzik Yükleniyor...</span></div>
                <div class="track-artist" id="song-artist"></div>
            </div>
            <div class="controls">
                <button class="music-btn" onclick="prevSong()" aria-label="Önceki şarkı">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button class="music-btn main" id="play-btn" onclick="togglePlay()" aria-label="Oynat / Durdur">
                    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                </button>
                <button class="music-btn" onclick="nextSong()" aria-label="Sonraki şarkı">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>
        <div class="mp-seek">
            <span class="time" id="time-current">0:00</span>
            <input type="range" class="seek" id="seek" min="0" max="1000" value="0" step="1" aria-label="Şarkı süresi">
            <span class="time total" id="time-total">0:00</span>
        </div>
    </div>

    <!-- 1. Ekran -->
    <div id="screen1" class="screen active" onclick="nextScreen(1)">
        <h1 class="title">Merhaba Elif...</h1>
        <p class="hint">(Devam etmek için ekrana dokun)</p>
    </div>

    <!-- 2. Ekran -->
    <div id="screen2" class="screen" onclick="nextScreen(2)">
        <h2 class="subtitle">5 aylık bu ilişkiyi bir de Berat'ın gözünden görmeye hazır mısın?</h2>
        <p class="hint">(Başlamak için dokun)</p>
    </div>

    <!-- 3. Ekran (Zaman Tüneli) -->
    <div id="screen3" class="screen">
        <h2 class="timeline-title">Bizim Hikayemiz</h2>
        <div class="timeline" id="timeline-container">
            <!-- JS ile doldurulacak -->
        </div>
        <br><br><br><br>
    </div>
    
    <!-- FİNAL EKRANI (150. Gün) -->
    <div id="final-modal">
        <h1 id="final-title">135-150. Günler</h1>
        <div id="final-text" class="cursor"></div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- YOUTUBE MÜZİK SİSTEMİ ---

        // Şarkı listen güncellendi! Aşkın Ertesi ilk sıraya alındı, istediklerin eklendi.
        const youtubeVideos = [
            { id: 'V8vIYP7G-zQ', alt: 'udiS3lB9wSE', title: 'Bahadır Tatlıöz - Aşkın Ertesi' },
            { id: 'mGr_5vbL80Y', alt: 'JQhVutggvvE', title: 'Duman - Her Şeyi Yak' },
            { id: 'VnG09qT6xKU', alt: 'AyPfRMUqeLo', title: 'Yüksek Sadakat - Kafile' },
            { id: 'OuUrfKk_eSc', alt: '3YL4Btzcf2Q', title: 'Ogün Sanlısoy - Saydım (Akustik 2012)' },
            { id: 'i8Od1PuJelc', alt: '_Qn_5kk0N40', title: 'Deniz Toprak - Diz Dize' }
        ];

        let player;
        let currentSongIndex = 0;
        let isPlaying = false;
        let userWantsPlay = false;   // Müziği kullanıcı başlattı mı?
        let usingAlt = false;        // Yedek video mu çalıyor?
        let failedInARow = 0;
        let isSeeking = false;       // Süre çubuğu sürüklenirken true

        const seekEl = document.getElementById('seek');
        const coverImg = document.getElementById('cover-img');
        coverImg.onerror = function () { this.style.display = 'none'; }; // Kapak yüklenmezse ♪ görünür

        function currentVideoId() {
            const song = youtubeVideos[currentSongIndex];
            return (usingAlt && song.alt) ? song.alt : song.id;
        }

        function setPlayingUI(state) {
            isPlaying = state;
            document.getElementById('music-player').classList.toggle('playing', state);
        }

        function formatTime(seconds) {
            const s = Math.max(0, Math.floor(seconds || 0));
            const r = s % 60;
            return Math.floor(s / 60) + ':' + (r < 10 ? '0' : '') + r;
        }

        function setSeekUI(ratio) {
            seekEl.value = Math.round(ratio * 1000);
            seekEl.style.setProperty('--p', (ratio * 100) + '%');
        }

        // Şarkı adını ve kapağı ekrana yazar, istenirse geçiş animasyonlarını çalıştırır
        function showSongInfo(animate) {
            const song = youtubeVideos[currentSongIndex];
            const full = song.title;
            const sep = full.indexOf(' - ');
            const artist = sep > -1 ? full.slice(0, sep) : '';
            const title = sep > -1 ? full.slice(sep + 3) : full;

            const info = document.getElementById('track-info');
            const titleEl = document.getElementById('song-name');
            document.getElementById('song-artist').innerText = artist;
            titleEl.innerText = title;
            titleEl.classList.remove('scroll');
            titleEl.style.removeProperty('--shift');

            coverImg.style.display = 'block';
            coverImg.src = 'https://i.ytimg.com/vi/' + song.id + '/mqdefault.jpg';

            if (animate) {
                info.classList.remove('swap');
                void info.offsetWidth; // animasyonu baştan başlat
                info.classList.add('swap');

                const cover = document.getElementById('cover');
                cover.classList.remove('pop');
                void cover.offsetWidth;
                cover.classList.add('pop');

                const box = document.getElementById('music-player');
                box.classList.add('changing');
                setTimeout(() => box.classList.remove('changing'), 900);
            }

            // Şarkı adı sığmıyorsa sağa sola kaysın
            const checkOverflow = () => {
                const overflow = titleEl.offsetWidth - titleEl.parentElement.clientWidth;
                titleEl.classList.remove('scroll');
                if (overflow > 4) {
                    titleEl.style.setProperty('--shift', (-(overflow + 6)) + 'px');
                    titleEl.classList.add('scroll');
                }
            };
            requestAnimationFrame(checkOverflow);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(checkOverflow);
        }

        function resetProgress() {
            setSeekUI(0);
            document.getElementById('time-current').innerText = '0:00';
            document.getElementById('time-total').innerText = '0:00';
        }

        function updateProgress() {
            if (!player || typeof player.getDuration !== 'function') return;
            const duration = player.getDuration() || 0;
            const current = player.getCurrentTime() || 0;
            document.getElementById('time-total').innerText = formatTime(duration);
            if (isSeeking) return; // Sürüklerken çubuğu elle oynatma
            setSeekUI(duration ? Math.min(1, current / duration) : 0);
            document.getElementById('time-current').innerText = formatTime(current);
        }

        // Çubuğu sürüklerken süreyi canlı göster
        seekEl.addEventListener('input', () => {
            isSeeking = true;
            const duration = (player && typeof player.getDuration === 'function') ? player.getDuration() : 0;
            const ratio = seekEl.value / 1000;
            seekEl.style.setProperty('--p', (ratio * 100) + '%');
            document.getElementById('time-current').innerText = formatTime(duration * ratio);
        });

        // Bırakınca şarkıda o noktaya atla
        seekEl.addEventListener('change', () => {
            if (player && typeof player.seekTo === 'function') {
                const duration = player.getDuration();
                if (duration) player.seekTo(duration * (seekEl.value / 1000), true);
            }
            isSeeking = false;
        });
        seekEl.addEventListener('pointercancel', () => { isSeeking = false; });

        function loadSong(index, play, useAlt) {
            currentSongIndex = (index + youtubeVideos.length) % youtubeVideos.length;
            usingAlt = !!useAlt;
            if (!useAlt) {
                showSongInfo(true);
                resetProgress();
            }
            if (!player || typeof player.loadVideoById !== 'function') return;
            if (play) {
                player.loadVideoById(currentVideoId());
            } else {
                player.cueVideoById(currentVideoId());
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: currentVideoId(),
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1, 'rel': 0 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            setInterval(updateProgress, 250);
            if (userWantsPlay) {
                player.loadVideoById(currentVideoId()); // Kullanıcı oynatıcı hazır olmadan dokunduysa şimdi başlat
            } else {
                const data = player.getVideoData ? player.getVideoData() : null;
                if (data && data.video_id !== currentVideoId()) player.cueVideoById(currentVideoId());
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                failedInARow = 0;
                setPlayingUI(true);
            } else if (event.data === YT.PlayerState.PAUSED) {
                setPlayingUI(false);
            } else if (event.data === YT.PlayerState.ENDED) {
                setPlayingUI(false);
                nextSong(); // Şarkı bitince diğerine geç
            }
        }

        // Video açılmazsa önce yedek koda, o da olmazsa sıradaki şarkıya geç
        function onPlayerError() {
            const song = youtubeVideos[currentSongIndex];
            if (!usingAlt && song.alt) {
                loadSong(currentSongIndex, userWantsPlay, true);
                return;
            }
            failedInARow++;
            if (failedInARow >= youtubeVideos.length) {
                userWantsPlay = false;
                setPlayingUI(false);
                return;
            }
            loadSong(currentSongIndex + 1, userWantsPlay);
        }

        function togglePlay() {
            if (!player || typeof player.playVideo !== 'function') {
                userWantsPlay = true;
                return;
            }
            if (isPlaying) {
                userWantsPlay = false;
                player.pauseVideo();
            } else {
                userWantsPlay = true;
                player.playVideo();
            }
        }

        function nextSong() {
            userWantsPlay = true;
            loadSong(currentSongIndex + 1, true);
        }

        function prevSong() {
            userWantsPlay = true;
            loadSong(currentSongIndex - 1, true);
        }

        // Sayfa açılınca ilk şarkının adı ve kapağı hazır olsun
        showSongInfo(false);


        // --- YAVAŞ YAZMA (TYPEWRITER) EFEKTİ ---
        function typeWriter(element, text, speed = 35) {
            let i = 0;
            element.innerHTML = "";
            element.classList.add("cursor");
            
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.classList.remove("cursor"); // Yazı bitince imleci kaldır
                }
            }
            type();
        }

        // --- EKRAN GEÇİŞLERİ ---
        function nextScreen(currentScreenNumber) {
            if(currentScreenNumber === 1) {
                userWantsPlay = true;
                if (player && typeof player.playVideo === 'function') player.playVideo();
            }

            const currentScreen = document.getElementById('screen' + currentScreenNumber);
            const nextScreen = document.getElementById('screen' + (currentScreenNumber + 1));
            
            currentScreen.classList.remove('active');
            
            setTimeout(() => {
                nextScreen.classList.add('active');
                if(currentScreenNumber + 1 === 3) {
                    document.body.style.overflowY = "auto";
                    // Müzik çaları 3. ekranda görünür yap
                    document.getElementById('music-player').classList.add('visible');
                }
            }, 1000);
        }

        // --- ZAMAN TÜNELİ VERİLERİ ---
        const storyData = [
            { title: "1. Gün", text: "Bana yazdın, çok heyecanlıydım. Hayatımda ilk defa bir kızı gerçekten seviyordum ve bana yazdı. Konuşmaya başladık, o heyecanla gece 4'e kadar konuştuk. Çok iyiydi, uyurken mutlu uyudum." },
            { title: "2. Gün", text: "Sabah kalktığımda tabii ki aklıma ilk sen geldin. Gece 4'te yatmamıza rağmen o heyecanla sabah erkenden kalktım ve ilk işim sana günaydın yazmaktı. Hala heyecanlıyım, hiç aklımdan çıkmıyorsun." },
            { title: "3. Gün", text: "Artık o kadar heyecanlıyız ki, o kadar yazışıyoruz ki... Şu 3 günde telefonla hayatımda hiç yazışmadığım kadar yazıştım seninle. Çok seviyordum seni." },
            { title: "10. Gün", text: "Okulun son günleri olduğu için 1 hafta gitmedik. Karne günü ilk defa konuşmaya başladıktan sonra geldim, saçımla hiç uğraşmadığım kadar uğraştım. Seni görmemiş gibi yaptım özür dilerim ama aslında görmüştüm, sadece çok heyecanlıydım." },
            { title: "20. Gün", text: "Normalde birisiyle 20 gün aralıksız asla konuşmam ama sen de, ben de aşıktık birbirimize." },
            { title: "30. Gün", text: "İlk ayımız... Yavaş yavaş seni gerçekten sevdiğimi anlamaya başladım. Alışıyordum sana. Benden utandığını seziyordum ve bunu anladığım zaman kendime söz verdim: Utanma huyunu beraber aşacaktık. Bunu hayal ederek yaşamaya başladım." },
            { title: "30-45. Günler", text: "Yani ilk defa bir yaz tatilim güzel, eğlenceli, sevgi dolu geliyordu. Ve küçük küçük bana alışmaya başladığın için sana olan sevgim daha da büyümeye başladı." },
            { title: "45-61. Günler", text: "2 ayı doldurduk ve gerçekten günlerce durmadan yazmaktan sıkılmadım, aksine sevgim artıyordu. Ve seni Trabzonlu yaptımmmmm!" },
            { title: "60-75. Günler", text: "İlk buluşmaları yapmıştık. O ilk günü hatırlıyorum, duvarın üstüne oturduk. İlk defa orada el ele tutuştuk. Elini zor veriyordun, yanıma gelmen için 2 saat uzaktan telefonla konuştum ama buna değdi. O duvarda oturduğumuz, sırt sırta verdiğimiz anlar çok güzeldi. Asla unutulmayacak günler." },
            { title: "75-90. Günler", text: "Galiba 2. buluşmayı da yaptık. Açıkçası garip bir buluşmaydı ama yine de anıydı, güzeldi. Yavaş yavaş alışıyordun ve ilk yanağından öptüğüm zamanlardı. Eve sarhoş gibi gittim." },
            { title: "90-105. Günler", text: "3. ay... Sana cidden alıştım. Arada küçük kavgalar etsek de küsmemek için, her seferinde küçük şeyleri büyütmeyelim diye yumuşattım. Çünkü sevdiğim, gerçekten sevdiğim birinden ayrılmak istemiyordum." },
            { title: "105-120. Günler", text: "4. ayı doldurduk. Gerçekten ben hayatımda bu kadar uzun bir zamanı bir insana ayırdığımı bilmiyorum. Annemle bile 1 gün konuşmadığım zaman vardır ama senle yoktur. Ve çok mutluydum." },
            { title: "120-135. Günler", text: "Artık okullar açıldı, birbirimizi gördük, alıştık. Cidden herkes öğrendi, artık biliyorlardı ve bizi seviyorlardı. Ayrılmamızı onlar bile istemezdi." },
            { title: "135-150. Günler", isFinal: true, text: "Artık cidden alıştık, seni bırakamam aşkım. Seni çok çok seviyorum. Hayatımda bir kızı seveceğimi düşünmezdim. Kimse düşünmezdi çünkü ben sevgili yapan biri değildim. Egomdan değil, doğru kişiyi istediğimden yapmıyordum ve sanırım buldum. Elif ben seni cidden çok seviyorum. Hayatımda büyük bir rol oynuyorsun aşkım. Sen olmasaydın eski, sıradan Berat olacaktı, sıkıcı günleri boş geçen... Ama artık her an aklıma sen gelebiliyorsun. Ve bana da alıştın, yüzüme baktın. 5 ay bunu bekledim ve karşılığını aldım. İyi ki de dayanmışım, buna sonuna kadar değdi. Aşkım ben senle 5 ay değil sonsuza kadar gitmek istiyorum. Sen de istersen neden olmasın, beraber olursak hiçbir şey imkansız olamaz. Elif seni çok seviyorum, bana çok şey kattın. Seni çok seviyorum birtanecik aşkkııımmm 💌" }
        ];

        const timelineContainer = document.getElementById('timeline-container');
        let highestUnlocked = 0;

        storyData.forEach((data, index) => {
            const position = index % 2 === 0 ? 'left' : 'right';
            const isLocked = index > highestUnlocked ? 'locked' : '';
            const lockIcon = index > highestUnlocked ? '🔒' : '💌';

            const html = `
                <div class="container ${position} ${isLocked}" id="item-${index}">
                    <div class="content" onclick="openItem(${index})">
                        <h3>${data.title} <span id="icon-${index}">${lockIcon}</span></h3>
                        <div class="text-body" id="text-${index}"></div>
                    </div>
                </div>
            `;
            timelineContainer.innerHTML += html;
        });

        function openItem(index) {
            const item = document.getElementById(`item-${index}`);
            const content = item.querySelector('.content');
            const data = storyData[index];
            
            if(item.classList.contains('locked')) return;

            // EĞER FİNAL GÜNÜYSE (150. Gün)
            if (data.isFinal) {
                // Ses efektini çal
                const specialSound = document.getElementById('special-sound');
                specialSound.play().catch(e => console.log("Ses efekti bulunamadı veya engellendi"));
                
                // Müzik çaları gizle ve arkaplanı göster
                document.getElementById('music-player').classList.remove('visible');
                const finalModal = document.getElementById('final-modal');
                finalModal.classList.add('active');
                
                // Final yazısını yavaş yavaş ekrana yazdır (biraz gecikmeli başlasın)
                setTimeout(() => {
                    const finalTextDiv = document.getElementById('final-text');
                    typeWriter(finalTextDiv, data.text, 50); // Final yazısı biraz daha yavaş ve vurgulu
                }, 1000);
                return;
            }

            // Normal günler için
            if(content.classList.contains('open')) return;

            content.classList.add('open');
            document.getElementById(`icon-${index}`).innerText = '💌';
            
            // Metni yavaş yavaş yazdır
            const textDiv = document.getElementById(`text-${index}`);
            typeWriter(textDiv, data.text, 35); // 35ms hızla yazdır

            // Kilidi açma
            if(index === highestUnlocked && index < storyData.length - 1) {
                highestUnlocked++;
                const nextItem = document.getElementById(`item-${highestUnlocked}`);
                nextItem.classList.remove('locked');
                
                setTimeout(() => {
                    nextItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 400);
            }
        }
    </script>
</body>
</html>
